<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>纪念 · 双身份工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">纪</div>
    <div>
      <div class="t1">纪念 · 双身份工作台</div>
      <div class="t2" id="syncStatus">同步未连接</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="syncbtn" id="connectBtn" title="手机连接">📱 连手机</button>
    <button class="syncbtn" id="syncBtn" title="立即同步">⟳ 同步</button>
  </div>
</header>

<!-- 手机连接浮层 -->
<div class="overlay" id="connectOverlay" hidden>
  <div class="sheet">
    <button class="close" id="closeConnect">✕</button>
    <h3>📱 手机连接工作台</h3>
    <p class="smtip">① 确保手机和电脑连<strong>同一个 WiFi</strong>。<br>② 用手机浏览器<strong>扫下方二维码</strong>（或手动输入地址）打开，数据自动同步。</p>
    <div class="qrwrap"><img id="qrImg" alt="二维码"></div>
    <select id="ipSelect" class="mini" style="margin-top:10px;width:100%;text-align:center;"></select>
    <div class="addr" id="lanAddr">检测中…</div>
    <p class="smtip">想让这个地址<strong>永久不变</strong>？把电脑 IP 设成静态（见下方说明）。</p>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="finance">
    <span class="dot blue"></span>
    甘肃鼎天测控科技
    <small>老板 · 财务</small>
  </button>
  <button class="tab" data-tab="trip">
    <span class="dot purple"></span>
    甘肃翰亚科技
    <small>项目经理 · 出差</small>
  </button>
</nav>

<main>
  <!-- ============ 财务板块 ============ -->
  <section class="panel active" id="panel-finance">
    <div class="cards">
      <div class="stat"><div class="k">期初余额</div><div class="v" id="fOpening">¥0.00</div></div>
      <div class="stat"><div class="k">总收入</div><div class="v green" id="fIncome">¥0.00</div></div>
      <div class="stat"><div class="k">总支出</div><div class="v red" id="fExpense">¥0.00</div></div>
      <div class="stat"><div class="k">期末结余</div><div class="v blue" id="fBalance">¥0.00</div></div>
    </div>

    <div class="box">
      <h3>期初余额设置</h3>
      <div class="inline">
        <input type="number" id="openingInput" placeholder="例如 50000" step="0.01">
        <button class="btn ghost" id="saveOpening">保存</button>
      </div>
    </div>

    <div class="box">
      <h3>新增财务记录</h3>
      <form id="financeForm">
        <div><label>日期</label><input type="date" id="fDate" required></div>
        <div><label>类型</label>
          <select id="fType">
            <option value="income">收入</option>
            <option value="expense">支出</option>
          </select>
        </div>
        <div><label>类别</label>
          <select id="fCategory">
            <option>销售收入</option><option>服务收入</option><option>工资薪酬</option>
            <option>设备采购</option><option>办公费用</option><option>房租水电</option>
            <option>税费</option><option>差旅</option><option>其他</option>
          </select>
        </div>
        <div><label>金额(¥)</label><input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" required></div>
        <div style="grid-column:1/-1"><label>备注</label><input type="text" id="fNote" placeholder="选填，如：客户A回款"></div>
        <div style="grid-column:1/-1"><button class="btn" type="submit">＋ 添加记录</button></div>
      </form>
    </div>

    <div class="box">
      <div class="boxhead">
        <h3>财务明细</h3>
        <select id="fMonth" class="mini"></select>
      </div>
      <div class="tablewrap">
        <table id="financeTable">
          <thead><tr><th>日期</th><th>类型</th><th>类别</th><th class="num">金额</th><th>备注</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="fEmpty">还没有记录，添加第一笔吧。</div>
    </div>
  </section>

  <!-- ============ 出差板块 ============ -->
  <section class="panel" id="panel-trip">
    <div class="cards">
      <div class="stat"><div class="k">出差次数</div><div class="v purple" id="tCount">0</div></div>
      <div class="stat"><div class="k">总天数</div><div class="v" id="tDays">0</div></div>
      <div class="stat"><div class="k">总开销</div><div class="v red" id="tCost">¥0.00</div></div>
      <div class="stat"><div class="k">总补助</div><div class="v green" id="tSubsidy">¥0.00</div></div>
    </div>

    <div class="box">
      <h3>新增出差记录</h3>
      <form id="tripForm">
        <div><label>出差人</label><input type="text" id="tPerson" placeholder="如：张经理" required></div>
        <div><label>出发地</label><input type="text" id="tFrom" placeholder="兰州" required></div>
        <div><label>目的地</label><input type="text" id="tTo" placeholder="西安" required></div>
        <div><label>开始日期</label><input type="date" id="tStart" required></div>
        <div><label>结束日期</label><input type="date" id="tEnd" required></div>
        <div><label>交通(¥)</label><input type="number" id="tTransport" value="0" step="0.01" min="0"></div>
        <div><label>住宿(¥)</label><input type="number" id="tLodging" value="0" step="0.01" min="0"></div>
        <div><label>餐饮(¥)</label><input type="number" id="tMeal" value="0" step="0.01" min="0"></div>
        <div><label>其他(¥)</label><input type="number" id="tOther" value="0" step="0.01" min="0"></div>
        <div><label>补助标准(¥/天)</label><input type="number" id="tSubsidyRate" value="200" step="0.01" min="0"></div>
        <div style="grid-column:1/-1"><label>备注</label><input type="text" id="tNote" placeholder="选填，如：项目验收"></div>
        <div style="grid-column:1/-1"><button class="btn purple" type="submit">＋ 添加出差</button></div>
      </form>
    </div>

    <div class="box">
      <h3>出差明细</h3>
      <div class="tablewrap">
        <table id="tripTable">
          <thead><tr><th>出差人</th><th>路线</th><th>日期</th><th class="num">天数</th><th class="num">开销</th><th class="num">补助</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="tEmpty">还没有出差记录。</div>
    </div>
  </section>
</main>

<footer class="bar">
  <button class="btn ghost" id="exportBtn">导出备份</button>
  <button class="btn ghost" id="importBtn">导入备份</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <span class="hint" id="lastSyncText"></span>
</footer>

<!-- 移动端底部标签栏 -->
<nav class="mobile-tabs">
  <button class="mtab active" data-tab="finance">💼 鼎天·财务</button>
  <button class="mtab" data-tab="trip">✈️ 翰亚·出差</button>
</nav>

<script src="app.js"></script>
</body>
</html>
